services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --x-frame-options NONE
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["mlflow-data:/mlflow"]
  api:
    build:
      context: .
      args:
        VITE_MLFLOW_URL: ${VITE_MLFLOW_URL:-http://localhost:5000}
        VITE_AIRFLOW_URL: ${VITE_AIRFLOW_URL:-http://localhost:8080}
    ports: ["8000:8000"]
    volumes:
      - "./logs:/app/logs"
      - "./reports/monitoring:/app/reports/monitoring"
volumes:
  mlflow-data:
