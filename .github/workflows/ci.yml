name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Unit + end-to-end smoke tests (synthetic data, CPU)
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pull model from DVC (skipped if no credentials secret)
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        if: env.GDRIVE_CREDENTIALS_DATA != ''
        run: |
          pip install "dvc[gdrive]" "pyOpenSSL<=24.2.1"
          dvc remote modify --local gdrive_remote gdrive_use_service_account true
          dvc pull models/model.keras models/classes.json
      - name: Build image
        run: |
          mkdir -p models
          docker build -t agroscan-api .
      - name: Smoke test container
        if: hashFiles('models/model.keras') != ''
        run: |
          docker run -d -p 8000:8000 --name api agroscan-api
          for i in $(seq 1 30); do curl -sf localhost:8000/ready && exit 0; sleep 3; done
          docker logs api; exit 1
